services:
  db:
    image: postgres:17-alpine
    container_name: helpdesk-demo-pg
    environment:
      POSTGRES_USER: helpdesk
      POSTGRES_PASSWORD: helpdesk
      POSTGRES_DB: helpdesk
    ports:
      - "5499:5432"
    volumes:
      - helpdesk_pgdata:/var/lib/postgresql/data
volumes:
  helpdesk_pgdata:
